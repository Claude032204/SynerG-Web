  <body>
    <!-- ===== Header ===== -->
    <header class="site-header">

        </nav>
      </div>
    </header>

    <!-- ===== Contact Section ===== -->
    <main class="container">
      <!-- Hero -->
      <section class="contact-hero">
        <h1>GET IN TOUCH WITH US!</h1>
      </section>

      <!-- Contact Content -->
      <section class="contact-section">
        <div class="contact-grid">
          <!-- LEFT -->
          <div class="contact-left">
            <div class="map-box">
              <iframe 
                src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d239.1981189068455!2d120.5885800557384!3d16.416195285752675!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3391a165ab20fa0d%3A0xbed4ae7297f4781a!2sSyner%20G%20Outsourcing%20Inc!5e0!3m2!1sen!2sph!4v1765943063785!5m2!1sen!2sph"
                width="800"
                height="600"
                style="border:0;"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
              </iframe>
            </div>

            <div class="info-cards">
              <div class="info-card">
                <div class="icon-side"><i class="fa-solid fa-phone"></i></div>
                <div class="text-side">
                  <span class="main-info">+63 927 772 7972</span>
                  <span class="sub-label">Phone Number</span>
                </div>
              </div>

              <div class="info-card">
                <div class="icon-side"><i class="fa-solid fa-envelope"></i></div>
                <div class="text-side">
                  <span class="main-info">info@synergoutsourcing.com</span>
                  <span class="sub-label">Email</span>
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT (POST form) -->
          <div class="contact-right">
            <form class="contact-form" action="../backend/contact.php" method="POST">
              <div class="field">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
              </div>

              <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required />
              </div>

              <div class="field">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Enter subject" />
              </div>

              <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
              </div>

              <button type="submit">Send Message</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- ===== Footer ===== -->
